name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_draft:
        description: "Crear GitHub Release en borrador con los artefactos"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version:
    name: Versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión
        id: out
        run: |
          set -euo pipefail
          PROPS=$(grep -m1 '<Version>' Directory.Build.props | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/' | tr -d '[:space:]')
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [[ "$TAG" != "$PROPS" ]]; then
              echo "ERROR: el tag v$TAG no coincide con Directory.Build.props ($PROPS)."
              echo "Ejecuta ./scripts/bump-version.sh $TAG y sube el commit antes del tag."
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$PROPS" >> "$GITHUB_OUTPUT"
          fi
          echo "HiveShock ${PROPS}"

  pack:
    name: Pack ${{ matrix.runtime }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            shell: pwsh
          - os: macos-latest
            runtime: osx-arm64
            shell: bash
          - os: macos-latest
            runtime: osx-x64
            shell: bash
          - os: ubuntu-latest
            runtime: linux-x64
            shell: bash
          - os: ubuntu-latest
            runtime: linux-arm64
            shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/Pack-Release.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ needs.version.outputs.version }}

      - name: Pack (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/pack-release.sh
          ./scripts/pack-release.sh --runtime ${{ matrix.runtime }} --version ${{ needs.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HiveShock-${{ needs.version.outputs.version }}-${{ matrix.runtime }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [version, pack]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.create_draft == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Notas desde CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          python3 - "$VER" <<'PY'
          import pathlib, sys
          ver = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          start = None
          chunks = []
          for i, line in enumerate(lines):
              if line.startswith(f"## [{ver}]"):
                  start = i
                  continue
              if start is not None and line.startswith("## [") and i != start:
                  break
              if start is not None:
                  chunks.append(line)
          body = "\n".join(chunks).strip()
          pathlib.Path("release-notes.md").write_text(
              (body + "\n") if body else f"HiveShock {ver}\n",
              encoding="utf-8",
          )
          PY

      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "ERROR: no hay artefactos"
            exit 1
          fi
          extra=()
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            extra+=(--draft --target "${GITHUB_SHA}")
          fi
          # 2.0.0-alpha.1 / -beta.2 / -rc.1: pre-release, no se ofrece como la última estable.
          if [[ "${VER}" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "v${VER}" "${files[@]}" \
            --title "HiveShock ${VER}" \
            --notes-file release-notes.md \
            "${extra[@]}"
