name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore HiveShock.Avalonia/HiveShock.Avalonia.csproj
          dotnet restore HiveShock.Cli/HiveShock.Cli.csproj
          dotnet restore HiveShock.Mobile/HiveShock.Mobile.csproj

      - name: Build
        run: |
          dotnet build HiveShock.Avalonia/HiveShock.Avalonia.csproj -c Release --no-restore
          dotnet build HiveShock.Cli/HiveShock.Cli.csproj -c Release --no-restore
          dotnet build HiveShock.Mobile/HiveShock.Mobile.csproj -c Release --no-restore

      - name: Test
        run: dotnet test HiveShock.Tests/HiveShock.Tests.csproj -c Release

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete "tools" ya no existe en el sdkmanager actual (rompía el job).
          packages: platform-tools

      - name: Workload Android
        run: dotnet workload install android

      - name: Build APK (unsigned debug)
        run: dotnet build HiveShock.Android/HiveShock.Android.csproj -c Release

      - name: versionCode coincide con Version
        run: |
          set -euo pipefail
          VER=$(grep -m1 '<Version>' Directory.Build.props | sed -E 's/.*<Version>([^<]+)<\/Version>.*/\1/' | tr -d '[:space:]')
          CORE="${VER%%-*}"; IFS=. read -r MA MI PA <<< "$CORE"
          EXPECTED=$((MA * 10000 + MI * 100 + PA))
          ACTUAL=$(dotnet msbuild HiveShock.Android/HiveShock.Android.csproj -getProperty:ApplicationVersion | tr -d '[:space:]')
          echo "esperado=$EXPECTED real=$ACTUAL"
          [[ "$EXPECTED" == "$ACTUAL" ]]

  # iOS es experimental (nunca se ha compilado en un Mac real): no bloquea el CI hasta que se verifique.
  ios:
    name: Build (iOS, experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # El workload más reciente de iOS (27.x) pide Xcode 27; macos-latest solo llega a Xcode 26.x.
      # Se fija iOS 26.5 (scripts/ios-workload-rollback.json) y se selecciona el Xcode 26.5 que le corresponde.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Workload iOS fijado y Xcode a juego
        run: |
          set -euo pipefail
          dotnet workload install ios --from-rollback-file scripts/ios-workload-rollback.json
          ls ~/.dotnet/packs | grep -i ios || true
          VER=$(ls ~/.dotnet/packs | grep -E '^Microsoft\.iOS\.Sdk\.net10\.0_26\.[0-9]+$' | sed 's/.*_//' | sort -V | tail -1)
          echo "iOS SDK $VER"
          sudo xcode-select -s "/Applications/Xcode_${VER}.app/Contents/Developer"
          xcodebuild -version

      - name: Build (sin firmar)
        run: dotnet build HiveShock.iOS/HiveShock.iOS.csproj -f net10.0-ios -c Release -r ios-arm64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
