name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore HiveShock.Avalonia/HiveShock.Avalonia.csproj
          dotnet restore HiveShock.Cli/HiveShock.Cli.csproj

      - name: Build
        run: |
          dotnet build HiveShock.Avalonia/HiveShock.Avalonia.csproj -c Release --no-restore
          dotnet build HiveShock.Cli/HiveShock.Cli.csproj -c Release --no-restore

      - name: Test
        run: dotnet test HiveShock.Tests/HiveShock.Tests.csproj -c Release

  android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El paquete "tools" ya no existe en el sdkmanager actual (rompía el job).
          packages: platform-tools

      - name: Workload Android
        run: dotnet workload install android

      - name: Build APK (unsigned debug)
        run: dotnet build HiveShock.Android/HiveShock.Android.csproj -c Release
